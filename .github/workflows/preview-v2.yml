name: Deploy V2 Preview

on:
  push:
    branches: [gh-sales-os-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build V2 preview
        run: npm run build
        env:
          VITE_PREVIEW: 'true'

      - name: Deploy preview to GitHub Pages subfolder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: v2
          keep_files: true
